# Build Proton Wine 11.0 for Android, x86_64 + arm64ec.
#
# Treats the repo as a patch overlay: checks out upstream Wine 11.0,
# overlays patches/ + build-scripts/ + android/ from this repo, runs the build.
# Output: a single uncompressed .wcp tar per architecture.
name: Build Proton Wine (ESYNC, SDK 28, 16KB pages)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      fail-fast: false

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      # Check out this patch overlay (patches/, build-scripts/, android/).
      - name: Checkout patch overlay (this repo)
        uses: actions/checkout@v4
        with:
          path: proton-wine-p11

      # Check out upstream Wine 11.0 (ValveSoftware/wine proton_11.0).
      - name: Checkout Wine 11.0 source
        uses: actions/checkout@v4
        with:
          repository: ValveSoftware/wine
          ref: proton_11.0
          path: wine-src
          fetch-depth: 1

      # Overlay patches/, build-scripts/, android/ on top of the Wine source.
      # Build scripts expect to run from the Wine source root.
      - name: Overlay patches onto Wine source
        run: |
          cp -r proton-wine-p11/patches        wine-src/
          cp -r proton-wine-p11/build-scripts   wine-src/
          cp -r proton-wine-p11/android         wine-src/
          # Sanity check overlay.
          ls -la wine-src/patches wine-src/build-scripts wine-src/android | head -20

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386

      - name: Download and extract termuxfs for ${{ matrix.arch }}
        run: |
          mkdir -p $HOME/termuxfs/${{ matrix.arch }}
          cd $HOME/termuxfs/${{ matrix.arch }}
          wget -q https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-${{ matrix.arch }}.tar
          tar -xf termuxfs-${{ matrix.arch }}.tar
          ls -la $HOME/termuxfs/${{ matrix.arch }}/

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      # ccache — caches compiled objects across runs (per-arch, rolling
      # restore-keys). The build scripts wrap clang/clang++ in ccache
      # automatically when it is on PATH.
      - name: Cache ccache (${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-p11-esync-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-p11-esync-${{ matrix.arch }}-

      - name: Run autogen.sh
        working-directory: wine-src
        run: bash autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-src/wine-tools
          key: wine-tools-esync-${{ hashFiles('wine-src/configure.ac', 'wine-src/configure') }}

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        working-directory: wine-src
        run: bash build-scripts/build-step0.sh

      - name: Build sysvshm library for ${{ matrix.arch }}
        if: matrix.arch == 'aarch64'
        working-directory: wine-src
        run: bash build-scripts/build-step-arm64ec.sh --build-sysvshm

      - name: Configure build for ${{ matrix.arch }}
        working-directory: wine-src
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --configure
          else
            bash build-scripts/build-step-arm64ec.sh --configure
          fi

      - name: Build Proton for ${{ matrix.arch }}
        working-directory: wine-src
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --build
          else
            bash build-scripts/build-step-arm64ec.sh --build
          fi

      - name: ccache stats (${{ matrix.arch }})
        if: always()
        run: ccache -s || true

      - name: Install Proton for ${{ matrix.arch }}
        working-directory: wine-src
        env:
          # Output dir inside the workspace so the .wcp lands in
          # $GITHUB_WORKSPACE/ after --package-wcp.
          OUTPUT_DIR: ${{ github.workspace }}/compiled-files-${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --install
          else
            bash build-scripts/build-step-arm64ec.sh --install
          fi

      - name: Download prefixPack.txz for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            wget -q https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-x86_64-11.txz -O $GITHUB_WORKSPACE/prefixPack.txz
          else
            wget -q https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz -O $GITHUB_WORKSPACE/prefixPack.txz
          fi

      - name: Package .wcp for ${{ matrix.arch }}
        working-directory: wine-src
        env:
          OUTPUT_DIR: ${{ github.workspace }}/compiled-files-${{ matrix.arch }}
          WCP_PREFIX_PACK: ${{ github.workspace }}/prefixPack.txz
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --package-wcp
          else
            bash build-scripts/build-step-arm64ec.sh --package-wcp
          fi
          ls -lh $GITHUB_WORKSPACE/proton-11.0-*.wcp

      - name: Upload Proton .wcp for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: proton-${{ matrix.arch }}
          path: proton-11.0-*.wcp
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.wcp" -exec cp {} release/ \;
          ls -lah release/

      - name: Generate date-based tag
        id: generate_tag
        run: |
          DATE=$(date +%Y%m%d)
          TAG_NAME="proton-11.0-esync-${DATE}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG_NAME}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          name: Proton Wine 11.0 ESYNC (${{ steps.generate_tag.outputs.tag_name }})
          files: release/*
          draft: false
          prerelease: false
          body: |
            # Proton 11.0 — ESYNC build

            Built from commit: ${{ github.sha }}

            ## Architectures
            - x86_64 (Intel/AMD 64-bit)
            - arm64ec (ARM64EC)

            Single SDK 28 build with 16KB page size support (works on Android 9+ and Android 15+).

            ## Sync backend
            ESYNC (eventfd-based) + FSYNC (futex-based).

            - `WINEFSYNC=1` enables FSYNC (requires kernel `futex_waitv`).
            - `WINEESYNC=1` enables ESYNC (requires raised `ulimit -n`, ~1M FDs).

            ## Packaging
            Plain tar `.wcp`. The inner `prefixPack.txz` is xz-compressed
            (pre-built payload from `GameNative/bionic-prefix-files`).

            ## WCP Files
            - `proton-11.0-x86_64.wcp` — for GameNative / Winlator
            - `proton-11.0-arm64ec.wcp` — for GameNative / Winlator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
